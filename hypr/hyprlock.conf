$font = Monospace

general {
    hide_cursor = true
}

auth {
    fingerprint {
        enabled = true
    }
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.dotfiles/wallpaper.png
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.2)

    outer_color = rgba(255, 255, 255, 0.2)
    fail_color = rgba(ff6633ee)

    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 10

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

